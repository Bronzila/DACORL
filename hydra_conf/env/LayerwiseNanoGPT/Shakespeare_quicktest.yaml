# Test configuration - MINIMAL single trial
defaults:
  - /env/LayerwiseNanoGPT@_here_

dataset_name: Shakespeare
num_epochs: 1  # Just 1 epoch for quick test
fraction_of_dataset: 1.0
train_validation_ratio: 0.9
epoch_mode: False  # CRITICAL: respect iters_per_epoch

# Small model
n_layer: 6
n_head: 6
n_embd: 384
dropout: 0.2
training_batch_size: 2
grad_acc_steps: 10  # REDUCED from 240 for speed test
block_size: 512

# Minimal iterations for testing
iters_per_epoch: 5  # REDUCED from 10
eval_iters: 2  # REDUCED from 10
