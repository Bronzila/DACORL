# nanoGPT Environment Configuration for Teacher HPO
# Similar structure to LayerwiseSGD.yaml but adapted for GPT

type: LayerwiseNanoGPT
initial_learning_rate: 0.0006  # 6e-4, common GPT learning rate
state_version: basic
num_epochs: 10  # Fewer epochs than CNN - GPT converges differently
num_runs: 20
epoch_mode: false
instance_mode: random_seed

# NanoGPT specific settings (from benchmark defaults)
n_layer: 12
n_head: 12
n_embd: 768
dropout: 0.0
bias: false
training_batch_size: 12
block_size: 1024
iters_per_epoch: 10  # Training iterations before adapting LR
eval_interval: 400
grad_acc_steps: 40  # 5 * 8
backend: nccl
device: cuda

# Optimizer parameters (SGD-specific)
optimizer_params:
  momentum: 0.9
  weight_decay: 0.1  # Standard GPT weight decay

# Dataset settings
dataset_name: OpenWebText
fraction_of_dataset: 1.0
train_validation_ratio: 0.8
crash_penalty: -10000.0

# Instance set - single dummy instance for random_seed mode
instance_set:
  0: [0]  # Dummy instance - actual config comes from random_seed mode

# Cutoff - maximum number of steps (num_epochs * iters_per_epoch)
cutoff: 100  # 10 epochs * 10 iters_per_epoch
