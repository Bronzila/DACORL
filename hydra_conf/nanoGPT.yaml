# nanoGPT configuration - Using Shakespeare dataset (recommended by Andrej Karpathy)
defaults:
  - env: LayerwiseNanoGPT/Shakespeare

results_dir: ./data/nanoGPT
num_train_iter: 30000
val_freq: 30000
seed: 0
eval_seed: 0
eval_protocol: "train"
teacher: "step_decay"
instance_mode: null
id: 0
agent_type: "td3_bc"
tanh_scaling: false
combination: "single"
mode: "data_gen"  # Options: "data_gen", "train", "eval", "all"
data_exists: false
wandb_group: "DACORL"
dataset_path: "./datasets/shakespeare"
device: "auto"  # Use "auto" to detect, "cuda" for GPU, "cpu" for CPU
